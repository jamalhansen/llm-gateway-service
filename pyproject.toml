[project]
name = "llm-gateway-service"
version = "0.1.0"
description = "Local HTTP service wrapping resolve_provider()'s multi-model dispatch, fallback, and logging behind one authenticated endpoint, with a concurrent multi-model comparison mode."
requires-python = ">=3.12"
dependencies = [
    "local-first-common[all-providers]",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "duckdb>=1.5.0",
]

[project.scripts]
llm-gateway-service = "llm_gateway.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_gateway"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.1",
]

[tool.uv.sources]
local-first-common = { git = "https://github.com/jamalhansen/local-first-common.git", branch = "main" }

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
